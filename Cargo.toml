[workspace]
resolver = "2"
members = ["core", "ui", "sim"]

# `firmware/` and `tr064/` join later (M2/M4). The firmware needs its own target
# and linker config, so it will be excluded from this workspace when it lands.

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
medienzeit-core = { path = "core" }
medienzeit-ui = { path = "ui" }
embedded-graphics = "0.8"
heapless = "0.8"
