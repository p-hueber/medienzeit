[package]
name = "medienzeit-firmware"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# Deliberately thin. Everything that can be decided without hardware lives in
# `core/`, `ui/` and `tr064/`, all of which are tested on the host.
#
# No embassy yet. Every published `esp-hal-embassy` (0.8.x and 0.9.x) enables
# `esp-hal/__esp_hal_embassy` from its default `executors` feature, and no released
# `esp-hal` 1.x defines that feature — the pairing is simply broken on crates.io today.
# Bring-up does not need async, so this is blocking `esp-hal` until that is resolved
# (either a fixed release, or a git pin to a matching pair).

[dependencies]
esp-hal = { version = "1.1", features = ["esp32s3", "unstable"] }
esp-println = { version = "0.17", default-features = false, features = ["esp32s3", "jtag-serial"] }
esp-backtrace = { version = "0.19", features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.5", features = ["esp32s3"] }
embedded-graphics = "0.8"
embedded-hal-bus = "0.3"
epd-waveshare = "0.6"
medienzeit-core = { path = "../core" }
medienzeit-ui = { path = "../ui" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2
