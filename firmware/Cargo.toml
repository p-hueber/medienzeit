[package]
name = "medienzeit-firmware"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# Deliberately thin. Everything that can be decided without hardware lives in
# `core/`, `ui/` and `tr064/`, all of which are tested on the host.
#
# Async comes from `esp-rtos`, not `esp-hal-embassy`. The latter is the superseded
# path: its default `executors` feature wants `esp-hal/__esp_hal_embassy`, which no
# released esp-hal 1.x defines. `esp-rtos` is the current scheduler, and it is also
# what `esp-radio` needs for its threads and queues.

[dependencies]
esp-hal = { version = "1.1", features = ["esp32s3", "unstable"] }
esp-rtos = { version = "0.3", features = ["esp32s3", "embassy", "esp-radio", "esp-alloc"] }
esp-alloc = "0.10"
esp-storage = { version = "0.9", features = ["esp32s3"] }
embedded-storage = "0.3"
embassy-executor = "0.10"
embassy-time = "0.5"
embassy-sync = "0.7"
embassy-net = { version = "0.7", features = ["dhcpv4", "udp", "tcp", "medium-ethernet"] }
esp-radio = { version = "0.18", features = ["esp32s3", "wifi", "unstable"] }
static_cell = "2"
esp-println = { version = "0.17", default-features = false, features = ["esp32s3", "jtag-serial"] }
esp-backtrace = { version = "0.19", features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.5", features = ["esp32s3"] }
embedded-graphics = "0.8"
embedded-hal-bus = "0.3"
epd-waveshare = "0.6"
es8311 = "0.1"
medienzeit-core = { path = "../core" }
medienzeit-ui = { path = "../ui" }
medienzeit-tr064 = { path = "../tr064" }
embedded-io-async = "0.6"
heapless = "0.8"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2
